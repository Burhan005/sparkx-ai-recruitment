<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <!-- Rounded Base Tile -->
  <rect width="80" height="80" rx="18" fill="#100F0D"/>
  <rect x="0.75" y="0.75" width="78.5" height="78.5" rx="17.25" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="1.5"/>

  <defs>
    <linearGradient id="fav-gold" x1="20" y1="14" x2="60" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#E2C58A"/>
      <stop offset="50%" stopColor="#D4AF37"/>
      <stop offset="100%" stopColor="#B38938"/>
    </linearGradient>
    <linearGradient id="fav-apex" x1="40" y1="36" x2="40" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#EAD29B"/>
      <stop offset="100%" stopColor="#C69B4C"/>
    </linearGradient>
  </defs>

  <!-- ARETE Apex Keystone Emblem -->
  <g>
    <!-- Keystone Crown -->
    <polygon points="26,14 54,14 62,33 18,33" fill="url(#fav-gold)"/>
    <polygon points="18,33 26,14 34,33" fill="#FFFFFF" fill-opacity="0.4"/>
    <polygon points="46,33 54,14 62,33" fill="#000000" fill-opacity="0.25"/>

    <!-- Outer Wing Flutes (Warm Ivory) -->
    <polygon points="12,39 21,36 29,67 20,69" fill="#FAF8F5"/>
    <polygon points="68,39 59,36 51,67 60,69" fill="#FAF8F5"/>

    <!-- Converging Evidence Vectors -->
    <polygon points="24,69 36,42 40,42 28,70" fill="#FAF8F5"/>
    <polygon points="56,69 44,42 40,42 52,70" fill="#FAF8F5"/>

    <!-- Center Apex Spear -->
    <polygon points="40,36 34,68 37.5,68 40,54 42.5,68 46,68" fill="url(#fav-apex)"/>
  </g>
</svg>
