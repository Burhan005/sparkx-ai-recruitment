<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Rounded Base Tile (Presentation Style 03) -->
  <rect width="100" height="100" rx="24" fill="#120F0D"/>
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="23.25" stroke="#3E2E24" stroke-width="1.5"/>

  <defs>
    <!-- Champagne Gold Satin Gradient -->
    <linearGradient id="fav-gold-ribbon" x1="68" y1="28" x2="26" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#DFD2C0" />
      <stop offset="30%" stopColor="#D5BF9F" />
      <stop offset="65%" stopColor="#C4A882" />
      <stop offset="100%" stopColor="#B39369" />
    </linearGradient>

    <!-- Gold Ribbon Shadow Crease -->
    <linearGradient id="fav-gold-crease" x1="48" y1="36" x2="62" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#9C7F59" />
      <stop offset="100%" stopColor="#C8AE8C" />
    </linearGradient>

    <!-- Architectural Pillar Gradient -->
    <linearGradient id="fav-pillar-facet" x1="56" y1="38" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#A89E92" />
      <stop offset="50%" stopColor="#93887B" />
      <stop offset="100%" stopColor="#7B7063" />
    </linearGradient>

    <!-- Deep Charcoal Outer Loop -->
    <linearGradient id="fav-charcoal-body" x1="16" y1="22" x2="48" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2A2420" />
      <stop offset="40%" stopColor="#171310" />
      <stop offset="100%" stopColor="#0B0908" />
    </linearGradient>
  </defs>

  <!-- 1. RIGHT ARCHITECTURAL PILLAR -->
  <g id="pillar-base">
    <path d="M 52 34 L 72 74 L 88 74 L 62 26 Z" fill="url(#fav-pillar-facet)"/>
    <path d="M 72 74 L 88 74 L 88 78 L 72 78 Z" fill="#63594D" opacity="0.8"/>
    <path d="M 52 34 L 62 26 L 65 33 L 56 42 Z" fill="#000000" opacity="0.4"/>
  </g>

  <!-- 2. DARK CHARCOAL OUTER LOOP -->
  <g id="charcoal-loop">
    <path
      d="M 18 70 C 13 62 17 44 28 28 C 34 20 42 16 48 18 C 54 20 56 26 51 34 L 38 56 C 34 62 28 68 22 71 C 20 72 18 71 18 70 Z"
      fill="url(#fav-charcoal-body)"
    />
    <path
      d="M 18 70 C 18 75 24 81 33 80 C 44 79 56 68 64 54 C 62 52 59 50 56 53 C 48 64 38 73 30 73 C 24 73 20 69 20 65 C 20 61 24 53 28 47 L 23 44 C 18 52 17 66 18 70 Z"
      fill="url(#fav-charcoal-body)"
    />
  </g>

  <!-- 3. CHAMPAGNE & GOLD SATIN RIBBON -->
  <g id="gold-satin-ribbon">
    <path
      d="M 21 66 C 26 73 36 75 46 69 C 58 61 68 47 72 37 C 75 30 72 26 66 28 C 60 30 55 36 50 45 L 43 57 C 37 66 29 68 21 66 Z"
      fill="url(#fav-gold-ribbon)"
    />
    <path
      d="M 66 28 C 72 26 75 30 72 37 C 70 42 66 50 61 57 C 62 50 65 40 66 35 C 67 31 66 29 64 30 C 60 32 56 38 52 45 L 50 45 C 55 36 60 30 66 28 Z"
      fill="url(#fav-gold-crease)"
    />
    <path
      d="M 23 66 C 30 72 39 73 48 68 C 58 61 68 48 71 38 C 70 38 69 40 68 42 C 64 51 55 63 45 69 C 37 73 28 72 23 66 Z"
      fill="#FFFFFF"
      opacity="0.35"
    />
  </g>
</svg>
