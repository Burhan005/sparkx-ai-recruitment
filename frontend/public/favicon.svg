<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <!-- Rounded Base Tile -->
  <rect width="80" height="80" rx="18" fill="#100F0D"/>
  <rect x="0.75" y="0.75" width="78.5" height="78.5" rx="17.25" stroke="#D6B477" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- ARETE Apex Keystone Emblem -->
  <g transform="translate(0, 0)">
    <!-- Keystone Crown (Champagne Amber) -->
    <polygon points="27,14 53,14 60,34 20,34" fill="#D6B477"/>
    <polygon points="20,34 27,14 34,34" fill="#F1EAE0" fill-opacity="0.45"/>
    <polygon points="46,34 53,14 60,34" fill="#B89454" fill-opacity="0.85"/>
    
    <!-- Outer Wing Flutes (Warm Ivory) -->
    <polygon points="12,41 20,37 27,67 18,69" fill="#F1EAE0"/>
    <polygon points="68,41 60,37 53,67 62,69" fill="#F1EAE0"/>
    
    <!-- Converging Vectors (Evidence Flutes) -->
    <polygon points="22,69 36,44 40,44 27,70" fill="#F1EAE0"/>
    <polygon points="58,69 44,44 40,44 53,70" fill="#F1EAE0"/>
    
    <!-- Center Apex Negative Space / Portal -->
    <polygon points="40,36 32,71 36,71 40,55 44,71 48,71" fill="#D6B477"/>
  </g>
</svg>
